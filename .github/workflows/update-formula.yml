# Keeps Formula/moss.rb (the CLI, both platforms) and Casks/moss.rb (the
# macOS desktop app) pointing at the newest published moss release.
#
# WHY THIS EXISTS: the formula was updated by hand, and updating it by hand is
# seven steps across two repos (version, two URLs, two sha256s you compute by
# downloading both binaries). It was skipped for v0.11.2 and v0.11.3, so
# `brew install moss` served 0.11.1 for two releases while the release page
# said otherwise. Nobody noticed, because a formula that is merely stale looks
# exactly like a formula that is current. The cask rides in the same job
# because both artifacts are cut from the same release and must never drift
# relative to each other.
#
# HOW IT FIRES:
#   repository_dispatch  — the real trigger. moss sends
#                          `moss-release-published` when a draft goes live.
#   workflow_dispatch    — run it by hand, optionally for a specific version.
#   schedule (weekly)    — backstop. If the dispatch is ever not wired up, the
#                          formula is at most a week stale instead of forever.
#
# It is safe to run at any time: it compares the formula against the newest
# published release and exits without a commit when they already agree.
name: Update moss formula

on:
  repository_dispatch:
    types: [moss-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "moss version without the leading v (default: newest published release)"
        required: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which version should the formula point at
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            VERSION="${REQUESTED#v}"
          else
            # --exclude-drafts is the point: release.yml uploads assets to a
            # DRAFT, and a draft's download URLs 404 for everyone but us. A
            # formula pointing at one would break every install.
            VERSION=$(gh release list --repo Symbiosis-Lab/moss \
              --exclude-drafts --exclude-pre-releases --limit 1 --json tagName \
              -q '.[0].tagName')
            VERSION="${VERSION#v}"
          fi
          # The formula has no top-level `version` — Homebrew scans it from
          # the url, and a redundant explicit version fails `brew audit
          # --strict`. Read the current version the same way: off the
          # Linux url, which is present regardless of which OS block a
          # human is reading this on.
          CURRENT=$(grep -oP '(?<=/v)[0-9][0-9.]*(?=/moss-linux-x86_64")' Formula/moss.rb)
          echo "formula is at $CURRENT; newest published release is $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Downloading both artifacts costs a runner-minute and buys the one
      # thing that matters here: a wrong sha256 does not fail quietly, it
      # fails in every user's terminal. SHA256SUMS is generated by the same
      # job that uploads the assets, so this checks the upload, not just the
      # manifest.
      - name: Hash the artifacts we are about to promise
        if: steps.target.outputs.changed == 'true'
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo Symbiosis-Lab/moss \
            --dir dl --pattern 'moss-linux-x86_64' --pattern 'moss-darwin-universal' \
            --pattern "moss_${VERSION}_universal.dmg" --pattern 'SHA256SUMS'
          LINUX=$(sha256sum dl/moss-linux-x86_64 | cut -d' ' -f1)
          DARWIN=$(sha256sum dl/moss-darwin-universal | cut -d' ' -f1)
          DMG=$(sha256sum "dl/moss_${VERSION}_universal.dmg" | cut -d' ' -f1)
          grep -q "$LINUX  moss-linux-x86_64" dl/SHA256SUMS
          grep -q "$DARWIN  moss-darwin-universal" dl/SHA256SUMS
          grep -q "$DMG  moss_${VERSION}_universal.dmg" dl/SHA256SUMS
          {
            echo "linux=$LINUX"
            echo "darwin=$DARWIN"
            echo "dmg=$DMG"
          } >> "$GITHUB_OUTPUT"

      # The formula's own `test do` asserts this, but it asserts it on the
      # user's machine after the download. Better here.
      - name: The binary agrees it is that version
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-0
          chmod +x dl/moss-linux-x86_64
          dl/moss-linux-x86_64 --version | grep -qw "$VERSION"

      - name: Rewrite the formula
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          LINUX: ${{ steps.sums.outputs.linux }}
          DARWIN: ${{ steps.sums.outputs.darwin }}
        run: |
          set -euo pipefail
          F=Formula/moss.rb
          OLD=$(grep -oP '(?<=/v)[0-9][0-9.]*(?=/moss-linux-x86_64")' "$F")
          # Match each sha256 by the asset name on the line above it, never
          # by position — the two on_macos/on_linux url+sha256 pairs read
          # identically apart from that name.
          OLD_DARWIN=$(grep -A1 'moss-darwin-universal"' "$F" | grep -oP 'sha256 "\K[0-9a-f]{64}')
          OLD_LINUX=$(grep -A1 'moss-linux-x86_64"' "$F" | grep -oP 'sha256 "\K[0-9a-f]{64}')
          sed -i \
            -e "s|/v$OLD/moss-|/v$VERSION/moss-|g" \
            -e "s|$OLD_DARWIN|$DARWIN|" \
            -e "s|$OLD_LINUX|$LINUX|" \
            "$F"
          # Nothing may still point at the version we just left.
          if grep -q "v$OLD/moss-" "$F"; then
            echo "the rewrite left a v$OLD reference behind:"; grep -n "$OLD" "$F"; exit 1
          fi
          git diff "$F"

      # url interpolates version, so rewriting the version and sha256 lines
      # is the whole job.
      - name: Rewrite the cask
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          DMG: ${{ steps.sums.outputs.dmg }}
        run: |
          set -euo pipefail
          C=Casks/moss.rb
          OLD=$(grep -oP '^\s*version "\K[^"]+' "$C")
          OLD_DMG=$(grep -oP 'sha256 "\K[0-9a-f]{64}' "$C")
          sed -i \
            -e "s|version \"$OLD\"|version \"$VERSION\"|" \
            -e "s|$OLD_DMG|$DMG|" \
            "$C"
          # Nothing may still point at the version we just left.
          if grep -q "version \"$OLD\"" "$C"; then
            echo "the rewrite left a v$OLD reference behind:"; grep -n "$OLD" "$C"; exit 1
          fi
          git diff "$C"

      - name: Commit
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "moss $VERSION" -m "Follows moss v$VERSION. sha256s recomputed from the uploaded macOS binary, Linux binary and DMG and checked against the release's SHA256SUMS; the Linux binary reports $VERSION."
          git push
