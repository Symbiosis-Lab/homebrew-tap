# Keeps Formula/moss.rb (the CLI, both platforms) and Casks/moss.rb (the
# macOS desktop app) pointing at the newest published moss release.
#
# WHY THIS EXISTS: the formula was updated by hand, and updating it by hand is
# seven steps across two repos (version, two URLs, two sha256s you compute by
# downloading both binaries). It was skipped for v0.11.2 and v0.11.3, so
# `brew install moss` served 0.11.1 for two releases while the release page
# said otherwise. Nobody noticed, because a formula that is merely stale looks
# exactly like a formula that is current. The cask rides in the same job
# because both artifacts are cut from the same release and must never drift
# relative to each other.
#
# HOW IT FIRES:
#   repository_dispatch  — the real trigger. moss sends
#                          `moss-release-published` when a draft goes live.
#   workflow_dispatch    — run it by hand, optionally for a specific version.
#   schedule (weekly)    — backstop. If the dispatch is ever not wired up, the
#                          formula is at most a week stale instead of forever.
#
# It is safe to run at any time: it compares the formula against the newest
# published release and exits without a commit when they already agree.
name: Update moss formula

on:
  repository_dispatch:
    types: [moss-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "moss version without the leading v (default: newest published release)"
        required: false
      dry_run:
        description: "Download, verify and write the formula and cask, but commit nothing"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which version should the formula point at
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            VERSION="${REQUESTED#v}"
          else
            # --exclude-drafts is the point: release.yml uploads assets to a
            # DRAFT, and a draft's download URLs 404 for everyone but us. A
            # formula pointing at one would break every install.
            # Only app tags (vX.Y.Z): moss-core-v… and ffmpeg-… releases live
            # in the same repo and are often newer.
            VERSION=$(gh release list --repo Symbiosis-Lab/moss \
              --exclude-drafts --exclude-pre-releases --limit 30 --json tagName \
              -q '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
            VERSION="${VERSION#v}"
          fi
          # The cask carries the version on a line of its own, whatever the
          # release's file names are.
          CURRENT=$(grep -oP '^\s*version "\K[^"]+' Casks/moss.rb)
          echo "formula and cask are at $CURRENT; newest published release is $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # From 0.15.28 a release names its files moss-cli-mac,
          # moss-cli-linux-x86_64 and moss.dmg; before it, the older names.
          if [ "$(printf '%s\n' 0.15.28 "$VERSION" | sort -V | head -1)" = 0.15.28 ]; then
            { echo "mac_cli=moss-cli-mac"; echo "linux_cli=moss-cli-linux-x86_64"; echo "dmg_name=moss.dmg"; } >> "$GITHUB_OUTPUT"
          else
            { echo "mac_cli=moss-darwin-universal"; echo "linux_cli=moss-linux-x86_64"; echo "dmg_name=moss_${VERSION}_universal.dmg"; } >> "$GITHUB_OUTPUT"
          fi

      # Downloading the artifacts costs a runner-minute and buys the one
      # thing that matters here: a wrong sha256 does not fail quietly, it
      # fails in every user's terminal. SHA256SUMS is generated by the same
      # job that uploads the assets, so this checks the upload, not just the
      # manifest.
      - name: Hash the artifacts we are about to promise
        if: steps.target.outputs.changed == 'true'
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          MAC_CLI: ${{ steps.target.outputs.mac_cli }}
          LINUX_CLI: ${{ steps.target.outputs.linux_cli }}
          DMG_NAME: ${{ steps.target.outputs.dmg_name }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo Symbiosis-Lab/moss --dir dl \
            --pattern "$LINUX_CLI" --pattern "$MAC_CLI" --pattern "$DMG_NAME" --pattern 'SHA256SUMS'
          for NAME in "$LINUX_CLI" "$MAC_CLI" "$DMG_NAME"; do
            SUM=$(sha256sum "dl/$NAME" | cut -d' ' -f1)
            grep -qx "$SUM  $NAME" dl/SHA256SUMS
          done
          {
            echo "linux=$(sha256sum "dl/$LINUX_CLI" | cut -d' ' -f1)"
            echo "darwin=$(sha256sum "dl/$MAC_CLI" | cut -d' ' -f1)"
            echo "dmg=$(sha256sum "dl/$DMG_NAME" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # The formula's own `test do` asserts this, but it asserts it on the
      # user's machine after the download. Better here.
      - name: The binary agrees it is that version
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          LINUX_CLI: ${{ steps.target.outputs.linux_cli }}
        run: |
          set -euo pipefail
          chmod +x "dl/$LINUX_CLI"
          "dl/$LINUX_CLI" --version | grep -qw "$VERSION"

      # Both files are written whole from the templates in scripts/, so a
      # change of file names on the release is a change of inputs, not of a
      # regex over the previous formula.
      - name: Write the formula and the cask
        if: steps.target.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          MAC_CLI: ${{ steps.target.outputs.mac_cli }}
          LINUX_CLI: ${{ steps.target.outputs.linux_cli }}
          DMG_NAME: ${{ steps.target.outputs.dmg_name }}
          LINUX: ${{ steps.sums.outputs.linux }}
          DARWIN: ${{ steps.sums.outputs.darwin }}
          DMG: ${{ steps.sums.outputs.dmg }}
        run: |
          set -euo pipefail
          scripts/render.sh
          git diff

      - name: Commit
        if: steps.target.outputs.changed == 'true' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "moss $VERSION" -m "Follows moss v$VERSION. sha256s recomputed from the uploaded macOS and Linux command-line binaries and the DMG and checked against the release's SHA256SUMS; the Linux binary reports $VERSION."
          git push
